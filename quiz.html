<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GK Quiz App</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }

  .quiz-container {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    text-align: center;
  }

  .timer {
    font-size: 18px;
    margin-bottom: 10px;
    color: #ffd700;
  }

  h2 {
    margin-bottom: 20px;
  }

  .option {
    background: rgba(255,255,255,0.15);
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }

  .option:hover {
    background: rgba(255,255,255,0.3);
  }

  .feedback {
    margin-top: 15px;
    font-size: 22px;
  }

  button {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    background: #00e676;
    color: #000;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #00c853;
  }
</style>
</head>

<body>

<div class="quiz-container" id="quiz">
  <div class="timer" id="timer">⏱️ Time: 10</div>
  <h2 id="question"></h2>
  <div id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button id="nextBtn">Next</button>
</div>

<script>
const questions = [
  { q: "Capital of Australia?", options: ["Sydney", "Canberra", "Melbourne", "Perth"], answer: 1 },
  { q: "Largest planet?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 2 },
  { q: "National animal of India?", options: ["Lion", "Elephant", "Tiger", "Leopard"], answer: 2 },
  { q: "Longest river?", options: ["Amazon", "Nile", "Yangtze", "Ganga"], answer: 1 },
  { q: "Hardest substance?", options: ["Gold", "Iron", "Diamond", "Silver"], answer: 2 },
  { q: "Who invented electricity?", options: ["Newton", "Tesla", "Einstein", "Edison"], answer: 1 },
  { q: "How many continents?", options: ["5", "6", "7", "8"], answer: 2 },
  { q: "Fastest land animal?", options: ["Lion", "Tiger", "Horse", "Cheetah"], answer: 3 },
  { q: "Which gas plants absorb?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], answer: 1 },
  { q: "Largest ocean?", options: ["Indian", "Atlantic", "Pacific", "Arctic"], answer: 2 }
];

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const timerEl = document.getElementById("timer");
const nextBtn = document.getElementById("nextBtn");

let index = 0;
let score = 0;
let timeLeft = 10;
let timer;
let answered = false;

loadQuestion();

function loadQuestion() {
  clearInterval(timer);
  timeLeft = 10;
  answered = false;
  feedbackEl.textContent = "";

  const q = questions[index];
  questionEl.textContent = `Q${index + 1}. ${q.q}`;
  optionsEl.innerHTML = "";

  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    div.onclick = () => checkAnswer(i);
    optionsEl.appendChild(div);
  });

  startTimer();
}

function startTimer() {
  timerEl.textContent = `⏱️ Time: ${timeLeft}`;
  timer = setInterval(() => {
    timeLeft--;
    timerEl.textContent = `⏱️ Time: ${timeLeft}`;

    if (timeLeft === 0) {
      clearInterval(timer);
      feedbackEl.textContent = "😢 Time's up!";
      answered = true;
    }
  }, 1000);
}

function checkAnswer(selected) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  if (selected === questions[index].answer) {
    feedbackEl.textContent = "😊 Nice!";
    score++;
  } else {
    feedbackEl.textContent = "😢 Wrong!";
  }
}

nextBtn.onclick = () => {
  if (!answered) return;

  index++;
  if (index < questions.length) {
    loadQuestion();
  } else {
    quiz.innerHTML = `
      <h2>🎉 Quiz Completed!</h2>
      <p>Your Score: <strong>${score} / ${questions.length}</strong></p>
      <button onclick="location.reload()">Restart Quiz</button>
    `;
  }
};
</script>

</body>
</html>
